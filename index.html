<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maré Alerta</title>
    <meta name="description" content="Alerta preventivo de alagamentos para o comércio de Belém" />
    <script>
      // Aplica o tema salvo antes da primeira pintura, evitando o flash do tema errado.
      try {
        const theme = localStorage.getItem('mare-alerta-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
